name: Lean certificates
on:
  push:
    paths:
      - 'lean/**'
      - 'tools/check_lean_certificates.py'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'lean/**'
      - 'tools/check_lean_certificates.py'
      - '.github/workflows/lean.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certificates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check finite rational certificates independently
        run: python3 tools/check_lean_certificates.py
      - name: Install pinned Lean and build certificates
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Print and verify theorem axiom dependencies
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/lean
          lean --version | tee ../artifacts/lean/version.txt
          lake env lean -DwarningAsError=true Audit.lean | tee ../artifacts/lean/axioms.txt
          python3 ../tools/check_lean_certificates.py --axioms ../artifacts/lean/axioms.txt
      - name: Retain proof audit logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-certificates-${{ github.sha }}
          path: artifacts/lean/
          if-no-files-found: warn
          retention-days: 14
