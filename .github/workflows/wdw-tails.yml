name: WDW unbounded-observable audit
on:
  push:
    paths: ['research/wdw*.py', 'research/run_wdw*.py', 'research/wdw_tail_protocol.json', 'research/wdw_tail_results/**', 'tests/test_wdw*.py', '.github/workflows/wdw-tails.yml', 'requirements.txt']
  pull_request:
    paths: ['research/wdw*.py', 'research/run_wdw*.py', 'research/wdw_tail_protocol.json', 'research/wdw_tail_results/**', 'tests/test_wdw*.py', '.github/workflows/wdw-tails.yml', 'requirements.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wdw-tails-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Old and new WDW tests
        run: python -m unittest discover -s tests -p 'test_wdw*.py' -v
      - name: Recompute regulator and threshold audits
        run: python research/run_wdw_tail_audit.py --out artifacts/wdw-tails --check-against research/wdw_tail_results/summary.json
      - name: Plot tail and unbounded moments
        run: python research/plot_wdw_tails.py --results artifacts/wdw-tails
      - name: Preserve diagnostics including failed convergence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wdw-tails-${{ github.sha }}
          path: artifacts/wdw-tails/
          retention-days: 14
