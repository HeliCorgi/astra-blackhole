name: KS physical mass Dirac audit
on:
  push:
    branches:
      - audit/ks-physical-mass
    paths:
      - 'research/ks_mass_dirac_observable_audit.py'
      - 'research/ks_mass_dirac_results/**'
      - 'verification/ks_mass_dirac_verified_run.json'
      - '.github/workflows/ks-mass-dirac-audit.yml'
      - 'research/wdw_model.py'
  pull_request:
    paths:
      - 'research/ks_mass_dirac_observable_audit.py'
      - 'research/ks_mass_dirac_results/**'
      - 'verification/ks_mass_dirac_verified_run.json'
      - '.github/workflows/ks-mass-dirac-audit.yml'
      - 'research/wdw_model.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run positive-frequency mass Dirac audit
        run: |
          python research/ks_mass_dirac_observable_audit.py             --out artifacts/ks-mass/mass_dirac.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ks-physical-mass-dirac
          path: artifacts/ks-mass/
          retention-days: 14
