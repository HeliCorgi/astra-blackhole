name: KS physical mass Dirac audit
on:
  push:
    branches:
      - main
      - audit/ks-physical-mass
    paths:
      - 'research/ks_mass_dirac_observable_audit.py'
      - 'research/ks_y_clock_same_state_audit.py'
      - 'research/ks_kretschmann_candidate_audit.py'
      - 'research/ks_mass_dirac_results/**'
      - 'tools/check_ks_mass_dirac_results.py'
      - 'audit/ks_black_hole_obligations.json'
      - 'verification/ks_black_hole_claims.json'
      - 'verification/ks_mass_dirac_verified_run.json'
      - '.github/workflows/ks-mass-dirac-audit.yml'
      - 'research/wdw_model.py'
  pull_request:
    paths:
      - 'research/ks_mass_dirac_observable_audit.py'
      - 'research/ks_y_clock_same_state_audit.py'
      - 'research/ks_kretschmann_candidate_audit.py'
      - 'research/ks_mass_dirac_results/**'
      - 'tools/check_ks_mass_dirac_results.py'
      - 'audit/ks_black_hole_obligations.json'
      - 'verification/ks_black_hole_claims.json'
      - 'verification/ks_mass_dirac_verified_run.json'
      - '.github/workflows/ks-mass-dirac-audit.yml'
      - 'research/wdw_model.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run positive-frequency mass Dirac audit
        run: |
          python research/ks_mass_dirac_observable_audit.py \
            --out artifacts/ks-mass/mass_dirac.json
      - name: Run same-Dirac-state Y-clock audit
        run: |
          python research/ks_y_clock_same_state_audit.py \
            --out artifacts/ks-mass/y_clock.json
      - name: Run selected-mass Kretschmann audit
        run: |
          python research/ks_kretschmann_candidate_audit.py \
            --out artifacts/ks-mass/kretschmann.json
      - name: Check physical-mass follow-up regression
        run: |
          python tools/check_ks_mass_dirac_results.py \
            --artifact-dir artifacts/ks-mass \
            --baseline research/ks_mass_dirac_results/summary.json
      - name: Compile KS claim ledger
        run: |
          python tools/check_physics_audit.py \
            --obligations audit/ks_black_hole_obligations.json \
            --claims-out artifacts/ks-mass/claims.json \
            --check-against verification/ks_black_hole_claims.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ks-physical-mass-dirac
          path: artifacts/ks-mass/
          retention-days: 14
