name: Bianchi IX history coarse-graining audit
on:
  push:
    paths:
      - 'research/bianchi_ix_history_coarse.py'
      - 'research/bianchi_ix_history_coarse_input.json'
      - 'research/bianchi_ix_history_coarse_results/**'
      - 'tests/test_bianchi_ix_history_coarse.py'
      - 'docs/BIANCHI_IX_HISTORY_COARSE_AUDIT_ja.md'
      - '.github/workflows/bianchi-ix-history-coarse.yml'
  pull_request:
    paths:
      - 'research/bianchi_ix_history_coarse.py'
      - 'research/bianchi_ix_history_coarse_input.json'
      - 'research/bianchi_ix_history_coarse_results/**'
      - 'tests/test_bianchi_ix_history_coarse.py'
      - 'docs/BIANCHI_IX_HISTORY_COARSE_AUDIT_ja.md'
      - '.github/workflows/bianchi-ix-history-coarse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_bianchi_ix_history_coarse.py' -v
      - run: python research/bianchi_ix_history_coarse.py --input research/bianchi_ix_history_coarse_input.json --out artifacts/bianchi-ix-history-coarse/summary.json --check-against research/bianchi_ix_history_coarse_results/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bianchi-ix-history-coarse-${{ github.sha }}
          path: artifacts/bianchi-ix-history-coarse/
          retention-days: 14
