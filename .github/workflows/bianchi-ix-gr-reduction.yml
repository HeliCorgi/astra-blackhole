name: Bianchi IX GR reduction CAS
on:
  push:
    branches:
      - main
      - audit/bianchi-ix-gr-reduction
      - audit/bianchi-ix-maxima-backend
    paths:
      - 'cas/bianchi_ix_reference.json'
      - 'cas/cadabra/bianchi_ix_reduction.cdb'
      - 'cas/xact/bianchi_ix_reduction.wl'
      - 'cas/maxima/bianchi_ix_reduction.mac'
      - 'tools/check_bianchi_ix_gr_reduction.py'
      - 'tools/check_bianchi_ix_gr_reduction_maxima.py'
      - '.github/workflows/bianchi-ix-gr-reduction.yml'
  pull_request:
    paths:
      - 'cas/bianchi_ix_reference.json'
      - 'cas/cadabra/bianchi_ix_reduction.cdb'
      - 'cas/xact/bianchi_ix_reduction.wl'
      - 'cas/maxima/bianchi_ix_reduction.mac'
      - 'tools/check_bianchi_ix_gr_reduction.py'
      - 'tools/check_bianchi_ix_gr_reduction_maxima.py'
      - '.github/workflows/bianchi-ix-gr-reduction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cadabra:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Cadabra 2.5.14
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/cadabra2.deb \
            https://github.com/kpeeters/cadabra2/releases/download/2.5.14/cadabra2-2.5.14-ubuntu-24.04-noble-x86_64.deb
          echo "b9dc00c94eda9bff5d5e2f9793f6640c0c507d6ef2fc00401273e9b8659887ad  /tmp/cadabra2.deb" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y /tmp/cadabra2.deb
          cadabra2-cli --version || cadabra2 --version
      - name: Run independent Cadabra Bianchi IX reduction
        env:
          CADABRA_NO_UNICODE: '1'
        run: |
          mkdir -p artifacts/gr-reduction
          /usr/bin/time -p timeout 180s cadabra2-cli cas/cadabra/bianchi_ix_reduction.cdb 2>&1 | tee artifacts/gr-reduction/cadabra.log
          test -s artifacts/gr-reduction/cadabra_result.json
          grep -q ASTRA_CADABRA_BIANCHI_IX_OK artifacts/gr-reduction/cadabra.log
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compare CAS coefficients with repository implementation
        run: |
          python tools/check_bianchi_ix_gr_reduction.py \
            --reference cas/bianchi_ix_reference.json \
            --cadabra-result artifacts/gr-reduction/cadabra_result.json \
            --out artifacts/gr-reduction/comparison.json
      - name: Record xAct execution availability
        run: |
          printf '%s\n' '{"status":"PENDING","reason":"No licensed Wolfram Engine/xAct runner is configured in repository CI.","source":"cas/xact/bianchi_ix_reduction.wl"}' > artifacts/gr-reduction/xact_status.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bianchi-ix-gr-reduction
          path: artifacts/gr-reduction/
          retention-days: 14

  maxima:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Maxima/ctensor
        run: |
          sudo apt-get update
          sudo apt-get install -y maxima maxima-share
          maxima --version | tee /tmp/maxima-version.txt
          grep -q 'Maxima 5.46.0' /tmp/maxima-version.txt
      - name: Run independent Maxima Bianchi IX reduction
        run: |
          mkdir -p artifacts/gr-reduction-maxima
          cp /tmp/maxima-version.txt artifacts/gr-reduction-maxima/version.txt
          maxima --very-quiet -b cas/maxima/bianchi_ix_reduction.mac | tee artifacts/gr-reduction-maxima/maxima.log
          grep -q ASTRA_MAXIMA_BIANCHI_IX_OK artifacts/gr-reduction-maxima/maxima.log
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compare Maxima reduction with repository implementation
        run: |
          python tools/check_bianchi_ix_gr_reduction_maxima.py \
            --maxima-log artifacts/gr-reduction-maxima/maxima.log \
            --out artifacts/gr-reduction-maxima/comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bianchi-ix-gr-reduction-maxima
          path: artifacts/gr-reduction-maxima/
          retention-days: 14
