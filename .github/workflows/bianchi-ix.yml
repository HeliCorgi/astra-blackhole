name: Bianchi IX bridge audit
on:
  push:
    paths: ['research/bianchi_ix*','research/run_bianchi_ix_audit.py','research/plot_bianchi_ix.py','tests/test_bianchi_ix.py','docs/BIANCHI_IX_AUDIT_ja.md','.github/workflows/bianchi-ix.yml']
  pull_request:
    paths: ['research/bianchi_ix*','research/run_bianchi_ix_audit.py','research/plot_bianchi_ix.py','tests/test_bianchi_ix.py','docs/BIANCHI_IX_AUDIT_ja.md','.github/workflows/bianchi-ix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_bianchi_ix.py' -v
      - run: python research/run_bianchi_ix_audit.py --out artifacts/bianchi-ix
      - run: python research/plot_bianchi_ix.py --results artifacts/bianchi-ix --out artifacts/bianchi-ix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bianchi-ix-${{ github.sha }}
          path: artifacts/bianchi-ix/
          retention-days: 14
