name: Bianchi IX timeless resolvent pilot
on:
  push:
    branches:
      - research/bianchi-ix-timeless-resolvent
    paths:
      - 'research/bianchi_ix_timeless_resolvent.py'
      - 'research/run_bianchi_ix_timeless_resolvent.py'
      - 'tests/test_bianchi_ix_timeless_resolvent.py'
      - 'docs/BIANCHI_IX_TIMELESS_RESOLVENT_ja.md'
      - '.github/workflows/bianchi-ix-timeless-resolvent.yml'
  pull_request:
    paths:
      - 'research/bianchi_ix_timeless_resolvent.py'
      - 'research/run_bianchi_ix_timeless_resolvent.py'
      - 'tests/test_bianchi_ix_timeless_resolvent.py'
      - 'docs/BIANCHI_IX_TIMELESS_RESOLVENT_ja.md'
      - '.github/workflows/bianchi-ix-timeless-resolvent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_bianchi_ix_timeless_resolvent.py' -v
      - run: python research/run_bianchi_ix_timeless_resolvent.py --out artifacts/timeless-resolvent
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bianchi-ix-timeless-resolvent
          path: artifacts/timeless-resolvent/
          retention-days: 14
