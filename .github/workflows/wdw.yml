name: WDW quantum geometry audit
on:
  push:
    paths: ['research/wdw*', 'research/run_wdw_audit.py', 'research/plot_wdw.py', 'tests/test_wdw_geometry.py', '.github/workflows/wdw.yml', 'requirements.txt']
  pull_request:
    paths: ['research/wdw*', 'research/run_wdw_audit.py', 'research/plot_wdw.py', 'tests/test_wdw_geometry.py', '.github/workflows/wdw.yml', 'requirements.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wdw-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quantum-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Independent finite quantum geometry tests
        run: python -m unittest discover -s tests -p 'test_wdw_geometry.py' -v
      - name: Quantum evolution, grid/domain checks, classical controls
        run: python research/run_wdw_audit.py --out artifacts/wdw --check-against research/wdw_results/summary.json
      - run: python research/plot_wdw.py --results artifacts/wdw
      - name: Preserve diagnostics and wave density
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wdw-geometry-${{ github.sha }}
          path: artifacts/wdw/
          if-no-files-found: warn
          retention-days: 14
