name: Bianchi IX ever-entered region pilot
on:
  push:
    branches:
      - research/bianchi-ix-ever-entered
    paths:
      - 'research/bianchi_ix_ever_entered.py'
      - 'research/run_bianchi_ix_ever_entered.py'
      - 'tests/test_bianchi_ix_ever_entered.py'
      - 'docs/BIANCHI_IX_EVER_ENTERED_AUDIT_ja.md'
      - '.github/workflows/bianchi-ix-ever-entered.yml'
  pull_request:
    paths:
      - 'research/bianchi_ix_ever_entered.py'
      - 'research/run_bianchi_ix_ever_entered.py'
      - 'tests/test_bianchi_ix_ever_entered.py'
      - 'docs/BIANCHI_IX_EVER_ENTERED_AUDIT_ja.md'
      - '.github/workflows/bianchi-ix-ever-entered.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_bianchi_ix_ever_entered.py' -v
  pilot:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: v004, v0: '0.040', width: '0.30', maxdim: '78'}
          - {name: v006, v0: '0.060', width: '0.30', maxdim: '78'}
          - {name: v0075, v0: '0.075', width: '0.30', maxdim: '78'}
          - {name: narrow, v0: '0.050', width: '0.20', maxdim: '78'}
          - {name: broad, v0: '0.050', width: '0.45', maxdim: '78'}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python research/run_bianchi_ix_ever_entered.py --out artifacts/${{ matrix.name }} --v0 ${{ matrix.v0 }} --width ${{ matrix.width }} --maxdim ${{ matrix.maxdim }} --skip-classical
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bianchi-ix-ever-entered-${{ matrix.name }}
          path: artifacts/${{ matrix.name }}/
          retention-days: 14
  classical:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python research/run_bianchi_ix_ever_entered.py --out artifacts/classical --classical-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bianchi-ix-ever-entered-classical
          path: artifacts/classical/
          retention-days: 14
