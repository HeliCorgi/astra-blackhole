name: Schwarzschild to KS classical CAS bridge
on:
  push:
    branches:
      - main
      - audit/schwarzschild-ks-bridge
    paths:
      - 'cas/schwarzschild_ks_reference.json'
      - 'cas/maxima/schwarzschild_ks_bridge.mac'
      - 'cas/cadabra/schwarzschild_ks_bridge.cdb'
      - 'tools/check_schwarzschild_ks_bridge.py'
      - '.github/workflows/schwarzschild-ks-bridge.yml'
      - 'research/wdw_model.py'
  pull_request:
    paths:
      - 'cas/schwarzschild_ks_reference.json'
      - 'cas/maxima/schwarzschild_ks_bridge.mac'
      - 'cas/cadabra/schwarzschild_ks_bridge.cdb'
      - 'tools/check_schwarzschild_ks_bridge.py'
      - '.github/workflows/schwarzschild-ks-bridge.yml'
      - 'research/wdw_model.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Maxima and pinned Cadabra
        run: |
          sudo apt-get update
          sudo apt-get install -y maxima maxima-share
          maxima --version | tee artifacts-maxima-version.txt
          grep -q 'Maxima 5.46.0' artifacts-maxima-version.txt
          curl -L --fail --retry 3             -o /tmp/cadabra2.deb             https://github.com/kpeeters/cadabra2/releases/download/2.5.14/cadabra2-2.5.14-ubuntu-24.04-noble-x86_64.deb
          echo "b9dc00c94eda9bff5d5e2f9793f6640c0c507d6ef2fc00401273e9b8659887ad  /tmp/cadabra2.deb" | sha256sum -c -
          sudo apt-get install -y /tmp/cadabra2.deb
          cadabra2-cli --version
      - name: Run independent Maxima bridge
        run: |
          set -euo pipefail
          mkdir -p artifacts/schwarzschild-ks
          cp artifacts-maxima-version.txt artifacts/schwarzschild-ks/maxima-version.txt
          /usr/bin/time -p timeout 180s maxima --very-quiet -b cas/maxima/schwarzschild_ks_bridge.mac             | tee artifacts/schwarzschild-ks/maxima.log
          grep -q ASTRA_KS_MAXIMA_BRIDGE_OK artifacts/schwarzschild-ks/maxima.log
      - name: Run independent Cadabra bridge
        env:
          CADABRA_NO_UNICODE: '1'
        run: |
          set -euo pipefail
          /usr/bin/time -p timeout 180s cadabra2-cli cas/cadabra/schwarzschild_ks_bridge.cdb 2>&1             | tee artifacts/schwarzschild-ks/cadabra.log
          test -s artifacts/schwarzschild-ks/cadabra_result.json
          grep -q ASTRA_SCHWARZSCHILD_KS_CADABRA_OK artifacts/schwarzschild-ks/cadabra.log
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compare bridge with repository WDW implementation
        run: |
          python tools/check_schwarzschild_ks_bridge.py             --reference cas/schwarzschild_ks_reference.json             --maxima-log artifacts/schwarzschild-ks/maxima.log             --cadabra-result artifacts/schwarzschild-ks/cadabra_result.json             --out artifacts/schwarzschild-ks/comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: schwarzschild-ks-bridge
          path: artifacts/schwarzschild-ks/
          retention-days: 14
