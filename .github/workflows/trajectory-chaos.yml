name: Trajectory and chaos audit
on:
  push:
    paths: ['research/trajectory_chaos*', 'research/run_trajectory_chaos_audit.py', 'tests/test_trajectory_chaos.py', 'docs/TRAJECTORY_CHAOS_AUDIT_ja.md', '.github/workflows/trajectory-chaos.yml']
  pull_request:
    paths: ['research/trajectory_chaos*', 'research/run_trajectory_chaos_audit.py', 'tests/test_trajectory_chaos.py', 'docs/TRAJECTORY_CHAOS_AUDIT_ja.md', '.github/workflows/trajectory-chaos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_trajectory_chaos.py' -v
      - run: python research/run_trajectory_chaos_audit.py --out artifacts/trajectory-chaos
      - run: python research/plot_trajectory_chaos.py --results artifacts/trajectory-chaos --out artifacts/trajectory-chaos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trajectory-chaos-${{ github.sha }}
          path: artifacts/trajectory-chaos/
          retention-days: 14
