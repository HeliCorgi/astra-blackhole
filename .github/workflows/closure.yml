name: Minimal-state closure audit
on:
  push:
    paths:
      - 'research/*closure*'
      - 'research/closure_results/**'
      - 'research/collision_model.py'
      - 'tests/test_closure_states.py'
      - 'requirements.txt'
      - '.github/workflows/closure.yml'
  pull_request:
    paths:
      - 'research/*closure*'
      - 'research/closure_results/**'
      - 'research/collision_model.py'
      - 'tests/test_closure_states.py'
      - 'requirements.txt'
      - '.github/workflows/closure.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: closure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Conservation, projection, and positive-moment checks
        run: python -m unittest discover -s tests -p test_closure_states.py -v
      - name: Recompute all 90 cases and compare saved results
        run: python research/run_closure_audit.py --out artifacts/closure --check-against research/closure_results
      - name: Plot held-out comparison
        run: python research/plot_closure.py --results artifacts/closure
      - name: Preserve per-case outcomes, curves and reference checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: closure-audit-${{ github.sha }}
          path: artifacts/closure/
          if-no-files-found: warn
          retention-days: 14
