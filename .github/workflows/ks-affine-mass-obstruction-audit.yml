name: KS affine mass obstruction audit
on:
  push:
    branches:
      - main
      - audit/ks-affine-mass-obstruction
    paths:
      - 'research/ks_affine_mass_obstruction_audit.py'
      - 'research/ks_affine_mass_obstruction_results/**'
      - 'tests/test_ks_affine_mass_obstruction.py'
      - 'tools/check_ks_affine_mass_obstruction_results.py'
      - 'docs/KS_AFFINE_MASS_OBSTRUCTION_AUDIT_ja.md'
      - 'audit/ks_black_hole_obligations.json'
      - 'verification/ks_black_hole_claims.json'
      - '.github/workflows/ks-affine-mass-obstruction-audit.yml'
  pull_request:
    paths:
      - 'research/ks_affine_mass_obstruction_audit.py'
      - 'research/ks_affine_mass_obstruction_results/**'
      - 'tests/test_ks_affine_mass_obstruction.py'
      - 'tools/check_ks_affine_mass_obstruction_results.py'
      - 'docs/KS_AFFINE_MASS_OBSTRUCTION_AUDIT_ja.md'
      - 'audit/ks_black_hole_obligations.json'
      - 'verification/ks_black_hole_claims.json'
      - '.github/workflows/ks-affine-mass-obstruction-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_ks_affine_mass_obstruction.py' -v
      - name: Run affine mass obstruction audit
        run: python research/ks_affine_mass_obstruction_audit.py --out artifacts/ks-affine-mass/summary.json
      - name: Regression check
        run: |
          python tools/check_ks_affine_mass_obstruction_results.py \
            --artifact artifacts/ks-affine-mass/summary.json \
            --baseline research/ks_affine_mass_obstruction_results/summary.json
      - name: Compile KS claim ledger
        run: |
          python tools/check_physics_audit.py \
            --obligations audit/ks_black_hole_obligations.json \
            --claims-out artifacts/ks-affine-mass/claims.json \
            --check-against verification/ks_black_hole_claims.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ks-affine-mass-obstruction
          path: artifacts/ks-affine-mass/
          retention-days: 14
