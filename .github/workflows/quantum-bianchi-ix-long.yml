name: Quantum Bianchi IX three-wall audit
on:
  push:
    paths: ['research/quantum_bianchi_ix_long*', 'tests/test_quantum_bianchi_ix_long.py', 'docs/QUANTUM_BIANCHI_IX_LONG_AUDIT_ja.md', '.github/workflows/quantum-bianchi-ix-long.yml']
  pull_request:
    paths: ['research/quantum_bianchi_ix_long*', 'tests/test_quantum_bianchi_ix_long.py', 'docs/QUANTUM_BIANCHI_IX_LONG_AUDIT_ja.md', '.github/workflows/quantum-bianchi-ix-long.yml']
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the expensive full three-wall regeneration'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1', MPLBACKEND: Agg}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_quantum_bianchi_ix_long.py' -v
      - run: python research/plot_quantum_bianchi_ix_long.py --results research/quantum_bianchi_ix_long_results --out artifacts/qbix-long
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: quantum-bianchi-ix-three-wall-smoke-${{ github.sha }}, path: artifacts/qbix-long/, retention-days: 14}
  full:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1', MPLBACKEND: Agg}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - run: python research/run_quantum_bianchi_ix_long_audit.py --out artifacts/qbix-long-full --check-against research/quantum_bianchi_ix_long_results/summary.json
      - run: python research/plot_quantum_bianchi_ix_long.py --results artifacts/qbix-long-full --out artifacts/qbix-long-full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: quantum-bianchi-ix-three-wall-full-${{ github.sha }}, path: artifacts/qbix-long-full/, retention-days: 14}
