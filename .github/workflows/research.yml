name: Classical research checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests, exact algebra, geometry, and all three state audits
        run: python reproduce.py --out artifacts
      - name: Regenerate angular plots
        run: |
          python research/plot_angular.py --results artifacts/angular
          python research/plot_collision.py --results artifacts/collision
      - name: Retain results, including failures when available
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: classical-audit-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
