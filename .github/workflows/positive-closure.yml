name: Positive angular closure audit
on:
  push:
    paths:
      - 'research/positive_closure*'
      - 'research/positive_closure_results/**'
      - 'research/run_positive_closure_audit.py'
      - 'research/plot_positive_closure.py'
      - 'research/collision_model.py'
      - 'research/closure_model.py'
      - 'tests/**'
      - 'tools/check_positive_summary.py'
      - 'tools/verify_positive_closure_artifact.py'
      - 'requirements.txt'
      - '.github/workflows/positive-closure.yml'
  pull_request:
    paths:
      - 'research/**'
      - 'tests/**'
      - 'tools/check_positive_summary.py'
      - 'tools/verify_positive_closure_artifact.py'
      - 'requirements.txt'
      - '.github/workflows/positive-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: positive-closure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Recompute all 90 cases and verify both quadratures
        run: python research/run_positive_closure_audit.py --out artifacts/positive
      - name: Verify generated structure and archived aggregates
        run: |
          python tools/verify_positive_closure_artifact.py artifacts/positive
          python tools/check_positive_summary.py artifacts/positive/summary.json research/positive_closure_results/summary.json --self-test
      - name: Generate comparison plot
        run: python research/plot_positive_closure.py --results artifacts/positive
      - name: Preserve results, including failures when present
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: positive-angular-closure-${{ github.sha }}
          path: artifacts/positive/
          if-no-files-found: warn
          retention-days: 14
