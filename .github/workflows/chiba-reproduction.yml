name: Published WDW sector reproduction
on:
  push:
    paths: ['research/chiba*', 'research/run_chiba_reproduction.py', 'research/plot_chiba_reproduction.py', 'tests/test_chiba_reproduction.py', '.github/workflows/chiba-reproduction.yml', 'requirements.txt']
  pull_request:
    paths: ['research/chiba*', 'research/run_chiba_reproduction.py', 'research/plot_chiba_reproduction.py', 'tests/test_chiba_reproduction.py', '.github/workflows/chiba-reproduction.yml', 'requirements.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_chiba_reproduction.py' -v
      - run: python research/run_chiba_reproduction.py --out artifacts/chiba --check-against research/chiba_results/summary.json
      - run: python research/plot_chiba_reproduction.py --results artifacts/chiba
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: published-wdw-sector-${{ github.sha }}
          path: artifacts/chiba/
          retention-days: 14
