name: Physics audit gates
on:
  push:
    paths:
      - 'PHYSICS_AUDIT.md'
      - 'audit/**'
      - 'cas/**'
      - 'tools/check_physics_audit.py'
      - 'verification/bianchi_ix_timeless_*'
      - 'verification/bianchi_ix_gr_reduction_verified_run.json'
      - 'verification/bianchi_ix_gr_reduction_verified_run.json'
      - 'verification/physics_audit_*.json'
      - 'lean/AstraBlackhole/PhysicsAudit.lean'
      - 'verification/physics_audit_*.json'
      - 'lean/AstraBlackhole/PhysicsAudit.lean'
      - 'research/bianchi_ix_timeless_outer_cap_results/summary.json'
      - 'research/check_bianchi_ix_timeless_outer_cap_results.py'
      - 'research/run_bianchi_ix_timeless_outer_cap.py'
      - 'research/run_bianchi_ix_timeless_outer_cap_layer_scan.py'
      - '.github/workflows/physics-audit.yml'
  pull_request:
    paths:
      - 'PHYSICS_AUDIT.md'
      - 'audit/**'
      - 'cas/**'
      - 'tools/check_physics_audit.py'
      - 'verification/bianchi_ix_timeless_*'
      - 'research/bianchi_ix_timeless_outer_cap_results/summary.json'
      - 'research/check_bianchi_ix_timeless_outer_cap_results.py'
      - 'research/run_bianchi_ix_timeless_outer_cap.py'
      - 'research/run_bianchi_ix_timeless_outer_cap_layer_scan.py'
      - '.github/workflows/physics-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Recompute current timeless numerical regulator controls
        run: |
          python research/run_bianchi_ix_timeless_outer_cap.py --out artifacts/timeless-outer-cap
          python research/run_bianchi_ix_timeless_outer_cap_layer_scan.py --out artifacts/timeless-outer-cap
          python research/check_bianchi_ix_timeless_outer_cap_results.py --artifact-dir artifacts/timeless-outer-cap --baseline research/bianchi_ix_timeless_outer_cap_results/summary.json
      - name: Check finite-clock CAP publication summary
        run: python research/check_bianchi_ix_ever_entered_results.py
      - name: Validate obligations and compile scoped claim labels
        run: |
          python tools/check_physics_audit.py --self-test --obligations audit/physics_obligations.json --claims-out artifacts/physics-audit/claims.json --check-against verification/physics_audit_claims.json
          cat artifacts/physics-audit/claims.json
      - name: Retain audit outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physics-audit-${{ github.sha }}
          path: artifacts/physics-audit/
          if-no-files-found: warn
          retention-days: 14
