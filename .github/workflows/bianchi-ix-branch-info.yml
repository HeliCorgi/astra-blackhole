name: Bianchi IX branch information audit
on:
  push:
    paths:
      - 'research/bianchi_ix_branch_info.py'
      - 'research/quantum_bianchi_ix_long_results/summary.json'
      - 'tests/test_bianchi_ix_branch_info.py'
      - 'docs/BIANCHI_IX_BRANCH_INFO_AUDIT_ja.md'
      - '.github/workflows/bianchi-ix-branch-info.yml'
  pull_request:
    paths:
      - 'research/bianchi_ix_branch_info.py'
      - 'research/quantum_bianchi_ix_long_results/summary.json'
      - 'tests/test_bianchi_ix_branch_info.py'
      - 'docs/BIANCHI_IX_BRANCH_INFO_AUDIT_ja.md'
      - '.github/workflows/bianchi-ix-branch-info.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_bianchi_ix_branch_info.py' -v
      - run: python research/bianchi_ix_branch_info.py --input research/quantum_bianchi_ix_long_results/summary.json --out artifacts/bianchi-ix-branch-info/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bianchi-ix-branch-info-${{ github.sha }}
          path: artifacts/bianchi-ix-branch-info/
          retention-days: 14
