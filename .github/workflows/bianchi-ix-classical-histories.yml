name: Bianchi IX classical history control

on:
  push:
    branches:
      - main
      - research/bianchi-ix-histories
    paths:
      - 'research/bianchi_ix_classical_histories.py'
      - 'research/run_bianchi_ix_classical_histories.py'
      - 'tests/test_bianchi_ix_classical_histories.py'
      - '.github/workflows/bianchi-ix-classical-histories.yml'
  pull_request:
    paths:
      - 'research/bianchi_ix_classical_histories.py'
      - 'research/run_bianchi_ix_classical_histories.py'
      - 'tests/test_bianchi_ix_classical_histories.py'
      - '.github/workflows/bianchi-ix-classical-histories.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_bianchi_ix_classical_histories.py' -v
      - run: python research/run_bianchi_ix_classical_histories.py --out artifacts/bianchi-ix-classical-histories
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bianchi-ix-classical-histories
          path: artifacts/bianchi-ix-classical-histories/
          retention-days: 14
