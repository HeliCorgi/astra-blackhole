name: KS continuum threshold/domain audit
on:
  push:
    branches:
      - main
      - audit/ks-continuum-domain
    paths:
      - 'research/ks_continuum_domain_audit.py'
      - 'research/ks_continuum_domain_results/**'
      - 'tests/test_ks_continuum_domain.py'
      - 'tools/check_ks_continuum_domain_results.py'
      - 'docs/KS_CONTINUUM_DOMAIN_AUDIT_ja.md'
      - 'audit/ks_black_hole_obligations.json'
      - 'verification/ks_black_hole_claims.json'
      - '.github/workflows/ks-continuum-domain-audit.yml'
  pull_request:
    paths:
      - 'research/ks_continuum_domain_audit.py'
      - 'research/ks_continuum_domain_results/**'
      - 'tests/test_ks_continuum_domain.py'
      - 'tools/check_ks_continuum_domain_results.py'
      - 'docs/KS_CONTINUUM_DOMAIN_AUDIT_ja.md'
      - 'audit/ks_black_hole_obligations.json'
      - 'verification/ks_black_hole_claims.json'
      - '.github/workflows/ks-continuum-domain-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_ks_continuum_domain.py' -v
      - name: Run continuum threshold/domain audit
        run: python research/ks_continuum_domain_audit.py --out artifacts/ks-continuum/summary.json
      - name: Regression check
        run: |
          python tools/check_ks_continuum_domain_results.py \
            --artifact artifacts/ks-continuum/summary.json \
            --baseline research/ks_continuum_domain_results/summary.json
      - name: Compile KS claim ledger
        run: |
          python tools/check_physics_audit.py \
            --obligations audit/ks_black_hole_obligations.json \
            --claims-out artifacts/ks-continuum/claims.json \
            --check-against verification/ks_black_hole_claims.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ks-continuum-domain-audit
          path: artifacts/ks-continuum/
          retention-days: 14
